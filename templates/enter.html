<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To Overnight</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #fd6038;
            --gold-glow: rgba(255, 0, 0, 0.4);
            --text-silver: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #050505;
            background-image: linear-gradient(rgba(5, 5, 5, 0.85), rgba(5, 5, 5, 0.85)), url('/static/image_037302.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* ปุ่มด้านขวาบน */
        .sys-dashboard-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 20px;
            color: #888;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .sys-dashboard-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 50px;
        }

        /* ส่วนข้อความด้านซ้าย */
        .left-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .subtitle {
            color: var(--gold);
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 600;
            margin: 0;
            text-transform: uppercase;
        }

        .title {
            margin: 0;
            font-size: 75px;
            font-weight: 700;
            letter-spacing: 5px;
            background: var(--text-silver);
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
            color: transparent; 
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.8));
            text-transform: uppercase;
        }

        .quote {
            color: #777;
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0 30px 0;
            letter-spacing: 1px;
        }

        .footer-text {
            color: #444;
            font-size: 24px;
            letter-spacing: 3px;
            font-weight: 600;
            margin: 0;
        }

        .right-content {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-link {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 280px;  /* ความกว้าง */
            height: 75px;  /* ความสูง */
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s ease;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(250, 7, 7, 0.4);
            border-radius: 6px; /* เหลี่ยมนิดๆ ให้ดูแข็งแรงและหรูหรา */
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            overflow: hidden;
        }

        /* เอฟเฟกต์แสงวิ่งที่ขอบปุ่ม */
        .btn-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            transition: all 0.6s ease;
        }
        
        .btn-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(270deg, transparent, var(--gold), transparent);
            transition: all 0.6s ease;
        }

        .btn-link:hover {
            transform: scale(1.05) translateY(-2px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px var(--gold-glow);
            background: rgba(197, 160, 89, 0.08);
        }

        .btn-link:hover::before {
            left: 100%;
            transition: all 0.8s ease;
        }
        .btn-link:hover::after {
            right: 100%;
            transition: all 0.8s ease;
        }

        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 5;
        }

        .btn-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: all 0.3s ease;
        }

        .center-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
            transition: all 0.3s ease;
        }

        .btn-link:hover .btn-text {
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
        }

        .btn-link:hover .center-logo {
            filter: drop-shadow(0 0 10px var(--gold));
            transform: scale(1.1);
        }

        @media (max-width: 900px) {
            body { flex-direction: column; justify-content: center; overflow-y: auto; }
            .container { flex-direction: column; text-align: center; gap: 50px; padding: 50px 20px; }
            .sys-dashboard-btn { top: 15px; right: 15px; font-size: 10px; }
            .title { font-size: 45px; }
            .right-content { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="sys-dashboard-btn">SYSTEM DASHBOARD</div>

    <div class="container">
        <div class="left-content">
            <p class="subtitle">รายละเอียด</p>
            <h1 class="title">Overnight 815</h1>
            <p class="quote">I don't chase, I attract. What<br>belongs to me will simply find me.</p>
            <p class="footer-text">Overnight 815 1 YEARS</p>
        </div>

        <div class="right-content">
            <a href="/system" class="btn-link">
                <div class="btn-content">
                    <span class="btn-text">เข้าหน้าเว็บ</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) { return false; } 
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
        }
    </script>
</body>
</html>
